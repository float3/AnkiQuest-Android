name: 🐞 Bug
description: File a bug
type: "Bug"
labels:  ["Needs Triage"]

body:

  - type: checkboxes
    id: contact
    attributes:
      label: Checked for duplicates?
      description: Search [AnkiQuest Android issues](https://github.com/float3/AnkiQuest-Android/issues?q=is%3Aissue) for a similar issue.
      options:
        - label: This issue is not a duplicate
          required: true

  - type: dropdown
    id: desktop-check
    attributes:
      label: Does it also happen in the AnkiQuest desktop add-on?
      options:
        - "Yes"
        - "No"
        - I haven't checked

  - type: textarea
    id: steps
    attributes:
      label: What are the steps to reproduce this bug?
      description: Briefly explain what you did which caused this bug to occur
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: Briefly describe what happened, and what should have happened
    validations:
      required: true

  - type: textarea
    id: debug-info
    attributes:
      label: Debug info
      description: In the app, open Settings → ankiquest → Copy debug info and paste the report here.
      placeholder: Include the AnkiQuest section after the AnkiDroid version and device details.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra_info
    attributes:
      label: (Optional) Anything else you want to share?
      placeholder: List any extra information

  - type: checkboxes
    id: research
    attributes:
      label: Research
      description: Confirm the points below
      options:
        - label: I checked the [AnkiQuest Android README](https://github.com/float3/AnkiQuest-Android#readme) and did not find a solution.
          required: true
        - label: (Optional) I confirmed the issue still happens on the [latest AnkiQuest nightly](https://github.com/float3/AnkiQuest-Android/releases/tag/nightly).
          required: false
