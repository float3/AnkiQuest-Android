# SPDX-License-Identifier: AGPL-3.0-only
name: ankiquest workflow regression tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ankiquest_workflow_tests.yml'
      - '.github/workflows/ankiquest_screenshot_*.yml'
      - '.github/tests/screenshots.test.cjs'
      - '.github/tests/screenshot-storage.test.cjs'
  push:
    paths:
      - '.github/workflows/ankiquest_workflow_tests.yml'
      - '.github/workflows/ankiquest_screenshot_*.yml'
      - '.github/tests/screenshots.test.cjs'
      - '.github/tests/screenshot-storage.test.cjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test repository workflows
        run: node --test .github/tests/*.test.cjs
