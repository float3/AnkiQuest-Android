# SPDX-License-Identifier: AGPL-3.0-only
name: ankiquest shared fixtures

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare with the server's client fixtures and day verdicts
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/float3/ankiquest/master/tests/fixtures/clients.json \
            | diff - AnkiDroid/src/test/resources/ankiquest/clients.json
          curl -fsSL https://raw.githubusercontent.com/float3/ankiquest/master/tests/fixtures/day_verdicts.json \
            | diff - AnkiDroid/src/test/resources/ankiquest/day_verdicts.json
