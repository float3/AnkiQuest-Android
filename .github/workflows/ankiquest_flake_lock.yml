# SPDX-License-Identifier: AGPL-3.0-only
name: ankiquest flake.lock update

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ankiquest-flake-lock
  cancel-in-progress: false

jobs:
  update:
    name: Open a flake.lock update pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the sync token
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
            echo "::error::Set UPSTREAM_SYNC_TOKEN: a token for this repository with Pull requests read and write. Pull requests opened with GITHUB_TOKEN start no CI."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ankiquest

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Update inputs
        run: nix flake update

      - name: Open a pull request into ankiquest
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock is already current"
            exit 0
          fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base ankiquest --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("flake-lock-"))][0].number // empty')
          if [ -n "$open" ]; then
            echo "Pull request #$open already updates flake.lock"
            exit 0
          fi
          branch="flake-lock-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Update flake.lock" flake.lock
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base ankiquest --head "$branch" \
            --title "Update flake.lock" --body "Weekly \`nix flake update\`."
