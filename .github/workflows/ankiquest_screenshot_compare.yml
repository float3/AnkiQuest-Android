name: "ankiquest Screenshots: Compare"  # do not rename - referenced by ankiquest_screenshot_comment.yml

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

env:
  JAVA_TOOL_OPTIONS: -Dkotlin.daemon.options=autoshutdownIdleSeconds=10
  # Gradle retries HTTP 429 and 5xx, by default 3 tries 1s and 2s apart. Maven Central's rate
  # limit lasts longer than that, so try 7 times with doubling waits from 2s (about 2 minutes).
  GRADLE_OPTS: -Dorg.gradle.internal.repository.max.tentatives=7 -Dorg.gradle.internal.repository.initial.backoff=2000

jobs:
  compare-screenshot-test:
    name: compare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read # for clone
      actions: write # for upload-artifact

    steps:
      # Work around Ubuntu 26.04's RAM-backed /tmp until the image fix rolls out.
      # https://github.com/actions/runner-images/pull/14814
      - name: Keep /tmp on disk
        if: runner.os == 'Linux'
        run: |
          if [ "$(findmnt -n -o FSTYPE --target /tmp)" = "tmpfs" ]; then
            sudo systemctl mask tmp.mount
            sudo umount -l /tmp
          fi
          df -hT /tmp

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick the baseline workflow
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Stacked PRs target feature branches that never store a baseline, so
          # fall back to the default branch when the base branch has none.
          candidates="$BRANCH"
          [ "$BRANCH" = "$DEFAULT_BRANCH" ] || candidates="$candidates $DEFAULT_BRANCH"
          for branch in $candidates; do
            for workflow in ankiquest_screenshot_store.yml screenshot_store.yml; do
              # PR runs verify the store workflow without uploading a baseline.
              runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${branch}&status=success&per_page=50"                 --jq '[.workflow_runs[] | select(.event != "pull_request")] | length' 2>/dev/null || echo 0)
              if [ "${runs:-0}" -gt 0 ]; then
                if [ "$branch" != "$BRANCH" ]; then
                  echo "::notice::No screenshot baseline on ${BRANCH}; comparing against ${branch} instead."
                fi
                echo "workflow=${workflow}" >> "$GITHUB_OUTPUT"
                echo "branch=${branch}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo "workflow=ankiquest_screenshot_store.yml" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Download base branch screenshots
        id: baseline
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          name: screenshot
          workflow: ${{ steps.source.outputs.workflow }}
          workflow_conclusion: success
          search_artifacts: true
          allow_forks: false
          if_no_artifact_found: fail
          branch: ${{ steps.source.outputs.branch }}

      - name: Explain unavailable baseline
        if: ${{ failure() && steps.baseline.outcome == 'failure' }}
        run: |
          echo '::error::Screenshot comparison did not run. Neither the base branch nor the default branch has a baseline. Run the ankiquest Screenshots: Store Baseline workflow on the default branch, then rerun this check.'
          echo 'Screenshot comparison did not run because no baseline could be downloaded from the base branch or the default branch. Run **ankiquest Screenshots: Store Baseline** on the default branch, then rerun this check.' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Use open source provider: https://github.com/gradle/actions/blob/main/docs/setup-gradle.md#basic-caching
          cache-provider: basic
          gradle-version: wrapper

      - name: Robolectric SDK cache
        uses: ./.github/actions/robolectric-sdk-cache

      - name: Warm Gradle Cache
        # Keep compilation here: robolectricSdkDownload only downloads SDK jars.
        # Compiling resolves test dependencies within the retry (Issue 21682).
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 3
          command: ./gradlew robolectricSdkDownload compileScreenshotTests -Pscreenshot --daemon

      - name: Compare screenshots
        id: compare-screenshot-test
        run: |
          ./gradlew compareScreenshots -Pscreenshot --stacktrace

      - name: Stage screenshot diffs
        if: ${{ always() }}
        env:
          # Folder name inside the artifact (e.g. "screenshot-diff-pr-12345" on PRs, "screenshot-diff-main" on push)
          SUBDIR: ${{ github.event_name == 'pull_request' && format('screenshot-diff-pr-{0}', github.event.number) || format('screenshot-diff-{0}', github.ref_name) }}
        run: |
          # Preserve module paths so identically named tests cannot overwrite one another.
          mkdir -p "screenshot-diff/$SUBDIR"
          while IFS= read -r -d '' compare; do
            module="${compare%%/build/reports/screenshot-diffs/*}"
            relative="${compare#*/build/reports/screenshot-diffs/}"
            # Flatten local /diffs/ directory: keeps baselines apart from
            # diffs while testing, and means nothing inside artifact
            class="${relative%%/*}"
            name="${relative##*/}"
            destination="screenshot-diff/$SUBDIR/${module#./}/$class/$name"
            mkdir -p "$(dirname "$destination")"
            cp "$compare" "$destination"
          done < <(find . -type f -path '*/build/reports/screenshot-diffs/*_compare.png' -print0)

      - name: Upload screenshot diffs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: screenshot-diff  # referenced by screenshot_comment.yml
          path: screenshot-diff
          retention-days: 30

      - name: Upload screenshot diff reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: screenshot-diff-reports
          path: |
            **/build/reports
          retention-days: 30

      - name: Upload screenshot diff test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: screenshot-diff-test-results
          path: |
            **/build/test-results
          retention-days: 30

      - name: Save PR number
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p ./pr
          echo ${{ github.event.number }} > ./pr/NR
      - name: Persist PR number
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr  # downloaded by ankiquest_screenshot_comment.yml
          path: pr/
