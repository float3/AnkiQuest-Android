# SPDX-License-Identifier: AGPL-3.0-only
name: Bump pinned AnkiQuest server

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ankiquest-server-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'float3/AnkiQuest-Android'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the sync token
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::UPSTREAM_SYNC_TOKEN needs Contents, Pull requests and Issues read/write on this repository. Its pushes must start PR CI."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Alert once when a bump has remained red for two days
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          script: |
            const { alertStale } = require('./.github/ankiquest_server_bump.cjs');
            await alertStale({ github, context });

      - name: Keep reviewed main-branch automation outside the bump checkout
        run: |
          cp .github/ankiquest_server_snapshot.cjs "$RUNNER_TEMP/ankiquest_server_snapshot.cjs"
          cp .github/ankiquest_server_bump.cjs "$RUNNER_TEMP/ankiquest_server_bump.cjs"

      - name: Read the server's current data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: float3/ankiquest
          ref: master
          fetch-depth: 0
          path: server
          persist-credentials: false
          sparse-checkout: |
            docs/api/examples
            tests/fixtures

      - name: Update only the bump branch, preserving any review fixes
        id: branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin refs/heads/bot/server-bump > "$RUNNER_TEMP/server-bump-ref"; then
            git fetch origin bot/server-bump:refs/remotes/origin/bot/server-bump
            git checkout -b bot/server-bump origin/bot/server-bump
            if ! git merge --no-edit origin/main; then
              git merge --abort
              echo "::error::Merge main into bot/server-bump and resolve its conflicts; review fixes have not been overwritten."
              exit 1
            fi
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
            git checkout -b bot/server-bump
          fi
          node "$RUNNER_TEMP/ankiquest_server_snapshot.cjs" copy server
          git add AnkiDroid/src/test/resources/ankiquest-api AnkiDroid/src/test/resources/ankiquest AnkiDroid/src/test/resources/ankiquest-server.sha
          if ! git diff --cached --quiet; then
            git commit --signoff -m "Bump server to $(git -C server rev-parse --short HEAD)"
          fi
          if git diff --quiet origin/main...HEAD; then
            echo "The server snapshot is already present on main."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:refs/heads/bot/server-bump
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the bump pull request
        if: steps.branch.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          script: |
            const { execFileSync } = require('node:child_process');
            const path = require('node:path');
            const { readPin } = require(path.join(process.env.RUNNER_TEMP, 'ankiquest_server_snapshot.cjs'));
            const { updatePullRequest, serverCommits } = require(path.join(process.env.RUNNER_TEMP, 'ankiquest_server_bump.cjs'));
            const from = execFileSync('git', ['show', 'origin/main:AnkiDroid/src/test/resources/ankiquest-server.sha'], { encoding: 'utf8' }).trim();
            const to = readPin(process.cwd());
            const commits = serverCommits('server', from, to);
            await updatePullRequest({ github, context, from, to, commits });
