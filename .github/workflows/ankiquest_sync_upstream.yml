# SPDX-License-Identifier: AGPL-3.0-only
name: Sync upstream AnkiDroid

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require the sync token
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
            echo "::error::Set UPSTREAM_SYNC_TOKEN: a token for this repository with Pull requests read and write. Pull requests opened with GITHUB_TOKEN start no CI."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ankiquest
          fetch-depth: 0

      - name: Open a pull request from ankidroid:main into ankiquest
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          git fetch --no-tags https://github.com/ankidroid/Anki-Android.git main:refs/remotes/upstream/main
          behind=$(git rev-list --count HEAD..refs/remotes/upstream/main)
          if [ "$behind" -eq 0 ]; then
            echo "ankiquest already contains every upstream commit"
            exit 0
          fi
          open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=ankidroid:main&base=ankiquest&state=open" --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Pull request #$open is open and now includes the new commits"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls" --jq .html_url \
            -f base=ankiquest -f head=ankidroid:main \
            -f title="Merge upstream AnkiDroid" \
            -f body="$behind new commits from ankidroid/Anki-Android main.

          Merge with a merge commit, never squash or rebase, so ankiquest keeps upstream's history.

          If this conflicts, merge ankidroid/Anki-Android main into a branch from ankiquest, resolve there, and merge that branch instead; this pull request then shows as merged."
