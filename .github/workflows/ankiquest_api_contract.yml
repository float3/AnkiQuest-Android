# SPDX-License-Identifier: AGPL-3.0-only
name: ankiquest API contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_ref:
        description: "Optional server branch, tag or commit for an ad-hoc check; blank uses the committed pin"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: -Dkotlin.daemon.options=autoshutdownIdleSeconds=10
  # Gradle retries HTTP 429 and 5xx, by default 3 tries 1s and 2s apart. Maven Central's rate
  # limit lasts longer than that, so try 7 times with doubling waits from 2s (about 2 minutes).
  GRADLE_OPTS: -Dorg.gradle.internal.repository.max.tentatives=7 -Dorg.gradle.internal.repository.initial.backoff=2000

jobs:
  # The exact pin is checked as data in an isolated job, without a Gradle cache.
  # Only an explicit manual server_ref sends replacement data to the contract job.
  server:
    name: Server examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the immutable server pin or manual override
        id: server-ref
        env:
          SERVER_REF: ${{ inputs.server_ref }}
        run: echo "ref=$(node .github/ankiquest_server_snapshot.cjs ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: float3/ankiquest
          ref: ${{ steps.server-ref.outputs.ref }}
          path: server
          persist-credentials: false
          sparse-checkout: |
            docs/api/examples
            tests/fixtures

      - name: Verify the committed snapshot against its exact server commit
        if: inputs.server_ref == ''
        run: node .github/ankiquest_server_snapshot.cjs verify server

      - name: Keep manually requested server examples
        if: github.event_name == 'workflow_dispatch' && inputs.server_ref != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-api-examples
          path: server/docs/api/examples/*.json
          if-no-files-found: error
          retention-days: 1

  contract:
    name: API contract
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download manually requested server examples
        if: github.event_name == 'workflow_dispatch' && inputs.server_ref != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-api-examples
          path: ${{ runner.temp }}/server-api-examples

      - name: Use manually requested examples, preserving the ownership catalog
        if: github.event_name == 'workflow_dispatch' && inputs.server_ref != ''
        shell: bash
        run: |
          node .github/ankiquest_server_snapshot.cjs examples "$RUNNER_TEMP/server-api-examples"

      - name: Configure JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        timeout-minutes: 10
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Robolectric SDK cache
        uses: ./.github/actions/robolectric-sdk-cache

      - name: Gradle Dependency Download
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 3
          command: ./gradlew robolectricSdkDownload --daemon

      - name: Run the contract test
        run: ./gradlew :AnkiDroid:testFullDebugUnitTest --tests 'com.ichi2.anki.ankiquest.AnkiquestApiContractTest' --daemon

      - name: Report Unit Test Results
        if: always() && hashFiles('**/build/test-results/**/TEST-*.xml') != ''
        run: python3 .github/report_test_failures.py . --pattern "build/test-results/**/TEST-*.xml" --title "API contract failures"
