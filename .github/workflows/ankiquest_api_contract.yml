# SPDX-License-Identifier: AGPL-3.0-only
name: ankiquest API contract

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      server_ref:
        description: "float3/ankiquest branch, tag or commit whose API examples to check against"
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: -Dkotlin.daemon.options=autoshutdownIdleSeconds=10

jobs:
  # Everything from the server checkout runs here, in a job with no cache, so it
  # can never reach the shared Gradle cache. The contract job gets the examples as data.
  server:
    name: Server examples and art
    if: github.event_name != 'schedule' || github.repository == 'float3/AnkiQuest-Android'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: float3/ankiquest
          ref: ${{ inputs.server_ref || 'master' }}
          path: server
          persist-credentials: false

      - name: Keep the server's current examples
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-api-examples
          path: server/docs/api/examples/*.json
          if-no-files-found: warn
          retention-days: 1

      - name: Check the app's art against the server's exporter
        # This runs the server's code, so not on the nightly run, which has the default branch's cache access.
        # Pull requests and pushes still check the art.
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          if [ -f server/tools/export_android_art.py ]; then
            python3 -m venv "$RUNNER_TEMP/art"
            "$RUNNER_TEMP/art/bin/pip" install --quiet pillow
            "$RUNNER_TEMP/art/bin/python" server/tools/export_android_art.py --check .
          else
            echo "The server at this ref has no tools/export_android_art.py"
          fi

  contract:
    name: API contract
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the server's current examples
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: server-api-examples
          path: ${{ runner.temp }}/server-api-examples

      - name: Use the server's current examples
        shell: bash
        run: |
          examples="$RUNNER_TEMP/server-api-examples"
          resources=AnkiDroid/src/test/resources/ankiquest-api
          if compgen -G "$examples/*.json" > /dev/null; then
            find "$resources" -name '*.json' -delete
            cp "$examples"/*.json "$resources"/
            git status --short -- "$resources"
          else
            echo "The server at this ref has no docs/api/examples; checking the committed snapshot"
          fi

      - name: Configure JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        timeout-minutes: 10
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Gradle Dependency Download
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 3
          command: ./gradlew robolectricSdkDownload --daemon

      - name: Run the contract test
        run: ./gradlew :AnkiDroid:testFullDebugUnitTest --tests 'com.ichi2.anki.ankiquest.AnkiquestApiContractTest' --daemon

      - name: Report Unit Test Results
        if: always() && hashFiles('**/build/test-results/**/TEST-*.xml') != ''
        run: python3 .github/report_test_failures.py . --pattern "build/test-results/**/TEST-*.xml" --title "API contract failures"
