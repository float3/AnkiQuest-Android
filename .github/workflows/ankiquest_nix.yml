name: ankiquest Nix

# Builds and tests through the flake's dev shell inside the nixos/nix image.
# That image has no /lib64 loader or /usr/lib, like NixOS, so anything Gradle
# downloads that only runs on a usual Linux fails here as it would there.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flake.*'
      - 'gradle/**'
      - 'gradle.properties'
      - '**/*.gradle.kts'
      - 'buildSrc/**'
      - '.github/workflows/ankiquest_nix.yml'
  push:
    branches:
      - main
    paths:
      - 'flake.*'
      - 'gradle/**'
      - 'gradle.properties'
      - '**/*.gradle.kts'
      - 'buildSrc/**'
      - '.github/workflows/ankiquest_nix.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No setup-gradle cache here: this only runs when Gradle files change, and those changes
# change the cache key, so a cache would always miss.
env:
  # Gradle retries HTTP 429 and 5xx, by default 3 tries 1s and 2s apart. Maven Central's rate
  # limit lasts longer than that, so try 7 times with doubling waits from 2s (about 2 minutes).
  GRADLE_OPTS: -Dorg.gradle.internal.repository.max.tentatives=7 -Dorg.gradle.internal.repository.initial.backoff=2000

jobs:
  nixos:
    name: Build and test in the dev shell
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the flake and build
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e CI=true \
            -e NIX_CONFIG="experimental-features = nix-command flakes" \
            -e GRADLE_OPTS \
            nixos/nix sh -euc '
              git config --global --add safe.directory /src
              nix flake check
              nix run nixpkgs#alejandra -- --check flake.nix
              nix develop --command ./gradlew --no-daemon assemblePlayDebug
            '
