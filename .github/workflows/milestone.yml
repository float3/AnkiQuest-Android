name: PR Milestone

on:
  pull_request_target:
    types: [ closed ]

jobs:
  milestone:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const milestone = 79;
          try {
            await github.rest.issues.getMilestone({
              ...context.repo,
              milestone_number: milestone
            });
          } catch (error) {
            if (error.status !== 404) throw error;
            core.info(`Milestone ${milestone} does not exist in ${context.repo.owner}/${context.repo.repo}; skipping assignment.`);
            return;
          }

          await github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            milestone
          });

          // graphql query to get referenced issues to merged pull request
          const query = `query($_url:URI!) {
            resource(url:$_url) {
              ... on PullRequest {
                closingIssuesReferences(first:10) {
                  nodes {
                    number
                    repository {
                      nameWithOwner
                    }
                  }
                }              
              }
            }
          }`;

          const variables = {
            _url: context.payload.pull_request.html_url
          };

          const result = await github.graphql(query, variables);
          const refIssues = result.resource.closingIssuesReferences.nodes;

          const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
          for (const issue of refIssues) {
            if (issue.repository.nameWithOwner.toLowerCase() !== repository) continue;
            console.log("Adding milestone to linked issue: ", issue.number);

            // if issues have milestone, then it will be removed and updated with following
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              milestone
            });
          }
